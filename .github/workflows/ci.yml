name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - run: npm ci
      - run: npm --prefix client ci
      - run: npm --prefix client run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - run: npm ci
      - run: npm --prefix client ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reelsearch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reelsearch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The integration globalSetup runs `prisma migrate deploy`, so this also proves every migration applies to an empty database.
      - run: npm test

  design-gaps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      # docs/design.md lists open work on its "Gap:" and "Gaps:" lines; an issue that has closed no longer belongs there.
      - run: |
          status=0
          for n in $(grep -E '^Gaps?:' docs/design.md | grep -oE 'issues/[0-9]+' | cut -d/ -f2 | sort -un); do
            if [ "$(gh issue view "$n" --json state -q .state)" = CLOSED ]; then
              echo "::error file=docs/design.md::A Gap line still links closed issue #$n; update the line."
              status=1
            fi
          done
          exit $status
